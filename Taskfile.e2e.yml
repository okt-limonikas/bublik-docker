version: "3"

# E2E tasks. Five are listed by `task --list`:
#
#   task e2e:reset      wipe the stack, the fixtures and the test output
#   task e2e:up         start the stack and seed it if needed
#   task e2e:down       stop the stack, keeping its data
#   task e2e:test       run the Playwright suite
#   task e2e:test:ui    run the Playwright suite in UI mode
#
# The rest are helpers. Those without a `desc` stay runnable and show up in
# `task --list-all`; `internal: true` ones are only reachable from other tasks.
#
# E2E runs as its own Compose project against its own data directory, but the
# Compose files still bind the normal host ports — stop the production stack
# before starting this one.

vars:
  MANIFEST: '{{.BUBLIK_E2E_MANIFEST | default ".e2e/e2e-manifest.json"}}'
  PLAN: '{{.BUBLIK_E2E_PLAN_FILE | default "e2e/plan.yaml"}}'
  DATA_DIR: '{{.BUBLIK_E2E_DATA_DIR | default (printf "%s/e2e" .BUBLIK_DOCKER_DATA_DIR)}}'
  PUBLISH_DIR: '{{.BUBLIK_E2E_PUBLISH_DIR | default (printf "%s/logs/logs/e2e" .DATA_DIR)}}'
  # Converted Playwright results live beside the fixtures, never inside them:
  # seeding replaces the whole fixture publish directory and `e2e:reset` deletes
  # it, while accumulating result runs across resets is the entire point.
  RESULTS_DIR: '{{.BUBLIK_E2E_RESULTS_DIR | default (printf "%s/logs/logs/e2e-results" .DATA_DIR)}}'
  RUN_LOG_SCHEMA: bublik/bublik/data/schemas/run_log.json
  META_DATA_SCHEMA: bublik/bublik/data/schemas/meta_data.json
  NORMAL_PROJECT: '{{.COMPOSE_PROJECT_NAME | default "bublik"}}'
  PROJECT: '{{.BUBLIK_E2E_COMPOSE_PROJECT_NAME | default (printf "%s-e2e" (.COMPOSE_PROJECT_NAME | default "bublik"))}}'
  READY_TIMEOUT: '{{.BUBLIK_E2E_READY_TIMEOUT | default "180"}}'
  COMPOSE_FILES: -f docker-compose.yml -f docker-compose.db.yml
  COMPOSE: docker compose {{.COMPOSE_FILES}}

tasks:
  reset:
    desc: Wipe the E2E stack — database, fixtures, manifest and test output
    summary: |
      Remove the dedicated E2E containers and volumes, the generated fixtures
      and manifest, and Playwright's reports, traces and cached auth state.
      Leaves nothing behind; the next `task e2e:up` rebuilds and reseeds.

      Use `task --yes e2e:reset` to skip the confirmation in a script.
    prompt: This destroys the {{.PROJECT}} database and every generated E2E artifact. Continue?
    # Anchor for the shared environment. Task merges an included Taskfile's
    # root-level `env:` into the whole run (it would follow the production stack
    # into `task docker:up`), and rejects both YAML merge keys and `env: {ref:}`,
    # so a plain alias on each task is the way to share this. Keep this task
    # first: a YAML alias cannot precede its anchor.
    env: &e2e-env
      COMPOSE_PROJECT_NAME: "{{.PROJECT}}"
      COMPOSE_FILES: "{{.COMPOSE_FILES}}"
      BUBLIK_DOCKER_DATA_DIR: "{{.DATA_DIR}}"
      BUBLIK_E2E_COMPOSE_PROJECT_NAME: "{{.PROJECT}}"
      BUBLIK_NORMAL_COMPOSE_PROJECT_NAME: "{{.NORMAL_PROJECT}}"
      BUBLIK_E2E_MANIFEST: "{{.MANIFEST}}"
      BUBLIK_E2E_PUBLISH_DIR: "{{.PUBLISH_DIR}}"
      BUBLIK_E2E_RESULTS_DIR: "{{.RESULTS_DIR}}"
      BUBLIK_E2E_RUN_LOG_SCHEMA: "{{.RUN_LOG_SCHEMA}}"
      BUBLIK_E2E_META_DATA_SCHEMA: "{{.META_DATA_SCHEMA}}"
      BUBLIK_E2E_URL: "{{.API_URL}}"
      BUBLIK_E2E_API_URL: "{{.API_URL}}"
      BUBLIK_E2E_READY_TIMEOUT: "{{.READY_TIMEOUT}}"
      # Consumed by the Playwright suite, which runs with dir: bublik-ui.
      BASE_URL: "{{.API_URL}}/v2/"
      BUBLIK_E2E_RUN_OVERVIEW: "../{{.MANIFEST}}"
    cmds:
      - task: down:volumes
      - python3 scripts/e2e.py clean
      - echo "🧹 E2E stack, fixtures and test output removed"

  up:
    desc: Start the E2E stack and seed it with fixture runs if needed
    summary: |
      Build the images, start the dedicated E2E stack, wait until the API, UI,
      logs and Celery all answer, then seed the fixture runs — but only if the
      instance does not already have them, so this is cheap to re-run.

      The served UI is baked into the image, so bublik-ui changes reach the
      suite only through the rebuild this performs.
    env: *e2e-env
    vars:
      ARGS: '{{.ARGS | default .CLI_ARGS}}'
    deps: [":docker:setup"]
    cmds:
      - task: ":docker:build-images"
      - "{{.COMPOSE}} up --no-build -d"
      - task: ready
      - task: seed
        vars: { ARGS: '{{.ARGS}}' }
      - echo "🚀 E2E stack ready at {{.API_URL}}"

  down:
    desc: Stop the E2E stack, keeping its database and fixtures
    summary: |
      Remove the E2E containers but keep their volumes, so the next
      `task e2e:up` starts with the same data and skips seeding.
      Use `task e2e:reset` to throw the data away too.
    env: *e2e-env
    cmds:
      - "{{.COMPOSE}} down --remove-orphans"

  test:
    desc: Run the Playwright E2E suite against the stack
    summary: |
      Run the full suite (typecheck, feature-contract check, then the browser
      projects). Requires a seeded stack — run `task e2e:up` first.
      Arguments after -- go to Playwright, e.g. task e2e:test -- --grep @smoke
    env: *e2e-env
    dir: bublik-ui
    deps: [types:check]
    preconditions:
      - sh: curl --fail --silent --show-error --max-time 5 "{{.API_URL}}/api/v2/"
        msg: "E2E stack is not reachable at {{.API_URL}} — run `task e2e:up` first"
    cmds:
      # Playwright directly rather than through nx: nx claims flags like
      # --project for itself, and the checks its target depends on already ran
      # above as e2e:types:check.
      - CI=1 pnpm exec playwright test --config apps/bublik/playwright.config.ts {{.CLI_ARGS}}

  test:ui:
    desc: Run the Playwright E2E suite in UI mode (interactive)
    summary: |
      Open Playwright's UI mode against the running stack: pick and re-run
      individual tests, and step through traces. Requires `task e2e:up`.
    env: *e2e-env
    dir: bublik-ui
    deps: [types:check]
    preconditions:
      - sh: curl --fail --silent --show-error --max-time 5 "{{.API_URL}}/api/v2/"
        msg: "E2E stack is not reachable at {{.API_URL}} — run `task e2e:up` first"
    cmds:
      - pnpm exec playwright test --config apps/bublik/playwright.config.ts --ui --ui-host=127.0.0.1 --ui-port=0 {{.CLI_ARGS}}

  ###########################################
  #         Helpers (task --list-all)       #
  ###########################################
  plan:
    summary: |
      Validate the campaign in {{.PLAN}} and print what it expands to.
      Group differently with: task e2e:plan -- --by fixture
    env: *e2e-env
    cmds:
      - bublik-e2e plan --plan "{{.PLAN}}" {{.CLI_ARGS}}

  seed:
    vars:
      # Dedicated var, not CLI_ARGS directly, so `ci` can blank it — a caller
      # cannot override the special CLI_ARGS.
      ARGS: '{{.ARGS | default .CLI_ARGS}}'
    summary: |
      Generate the fixture runs and import them through the API, skipping
      bundles the instance already has. Bundles planned with +ui are left for
      the Playwright import project.
      Override the plan: task e2e:seed -- --day "2026-04-21:basic.ok=1"
    env: *e2e-env
    # Skip when the instance already has the plan's runs — but never skip an
    # explicit override, which is asking for something the manifest cannot know.
    status:
      - '{{if trim .ARGS}}false{{else}}python3 scripts/e2e.py seeded{{end}}'
    cmds:
      - |
        {{if trim .ARGS}}bublik-e2e run --setup-projects {{.ARGS}}
        {{else}}bublik-e2e run --plan "{{.PLAN}}" --setup-projects{{end}}

  fixtures:
    summary: |
      Generate the fixture bundles and manifest without importing anything.
      Override the plan: task e2e:fixtures -- --day "2026-04-21:basic.ok=1"
    env: *e2e-env
    cmds:
      - |
        {{if .CLI_ARGS}}bublik-e2e generate {{.CLI_ARGS}}
        {{else}}bublik-e2e generate --plan "{{.PLAN}}"{{end}}

  import:manifest:
    summary: |
      Import the already-generated manifest through the API, without
      regenerating fixtures. Idempotent; add flags after --, e.g.
      task e2e:import:manifest -- --include-ui
    env: *e2e-env
    cmds:
      - bublik-e2e import --setup-projects {{.CLI_ARGS}}

  import:via-ui:
    summary: |
      Import the +ui-marked bundles through the Playwright import form (the
      API bundles must already be seeded — run task e2e:up first).
    env: *e2e-env
    dir: bublik-ui
    deps: [types:check]
    cmds:
      - pnpm exec playwright test --config apps/bublik/playwright.config.ts --project auth --project import {{.CLI_ARGS}}

  report:bundle:
    summary: |
      Convert the last Playwright JSON report into a Bublik bundle and publish
      it, then print the import URL. Requires a completed `task e2e:test`.
      Import it too with: task e2e:report:bundle -- --import --create-project
      Arguments after -- go to `bublik-e2e playwright`.
    env: *e2e-env
    preconditions:
      - sh: test -f bublik-ui/dist/.playwright/apps/bublik/results.json
        msg: "No Playwright report yet — run `task e2e:test` first"
    cmds:
      - >
        bublik-e2e playwright
        --report bublik-ui/dist/.playwright/apps/bublik/results.json
        --publish-dir "{{.RESULTS_DIR}}"
        --source-root bublik-ui
        {{.CLI_ARGS}}

  logs:
    summary: |
      Show logs from the dedicated E2E Compose project.
      Follow one service: task e2e:logs -- -f celery
    env: *e2e-env
    cmds:
      - "{{.COMPOSE}} logs {{.CLI_ARGS}}"

  types:
    summary: |
      Sync the manifest TypeScript types in bublik-ui from the bublik-e2e
      schema. Commit the results.
    cmds:
      - bublik-e2e schema --out bublik-ui/apps/bublik/e2e/support/e2e-manifest.schema.json
      - cd bublik-ui && pnpm run e2e:codegen

  types:check:
    summary: |
      Fail when the manifest types are stale, a feature scenario has no test,
      or the e2e code does not typecheck.
    cmds:
      - bublik-e2e schema | diff -u bublik-ui/apps/bublik/e2e/support/e2e-manifest.schema.json - || (echo "Schema drift — run task e2e:types" && exit 1)
      - cd bublik-ui && pnpm run e2e:codegen:check
      - cd bublik-ui && pnpm run e2e:features:check
      - cd bublik-ui && pnpm run e2e:typecheck

  ci:
    summary: |
      The whole pipeline on fresh volumes: reset, start, seed, test, then tear
      the stack down again. Artifacts are left in place for diagnostics.
    cmds:
      - defer: { task: down }
      # Arguments after -- belong to the test run; blank them out for the setup
      # steps so a Playwright flag never reaches the seeder.
      - task: reset
      - task: up
        vars: { ARGS: " " }
      - task: test

  ###########################################
  #         Internal steps                  #
  ###########################################
  ready:
    internal: true
    env: *e2e-env
    cmds:
      - ./scripts/e2e_ready.sh

  guard:
    internal: true
    env: *e2e-env
    cmds:
      - python3 scripts/e2e.py guard-compose-project

  down:volumes:
    internal: true
    env: *e2e-env
    cmds:
      - task: guard
      - "{{.COMPOSE}} down --volumes --remove-orphans"
