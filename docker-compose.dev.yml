services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - URL_PREFIX=${URL_PREFIX}
        - DOCS_URL=${DOCS_URL}
        # Exported by scripts/git_version_env.sh in the docker:dev:* Taskfile tasks.
        - BUBLIK_REPO_URL=${BUBLIK_REPO_URL:-}
        - BUBLIK_REPO_BRANCH=${BUBLIK_REPO_BRANCH:-}
        - BUBLIK_REPO_TAG=${BUBLIK_REPO_TAG:-}
        - BUBLIK_COMMIT_REV=${BUBLIK_COMMIT_REV:-}
        - BUBLIK_COMMIT_DATE=${BUBLIK_COMMIT_DATE:-}
        - BUBLIK_COMMIT_SUMMARY=${BUBLIK_COMMIT_SUMMARY:-}
        - BUBLIK_BUILD_DATE=${BUBLIK_BUILD_DATE:-}
    command: python manage.py run_mcp_server --host ${BUBLIK_DOCKER_MCP_HOST} --port ${BUBLIK_DOCKER_MCP_PORT}
    network_mode: host
    env_file: .env
    environment:
      - BUBLIK_DOCKER_PROXY_PORT=${BUBLIK_DOCKER_PROXY_PORT}
      - PER_CONF_DIR=${PER_CONF_DIR}
      - SECRET_KEY=${SECRET_KEY}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@bublik.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin}
      - URL_PREFIX=${URL_PREFIX}
      - BUBLIK_UI_DIR=${BUBLIK_UI_DIR}
      - BUBLIK_UI_DOCS_DIR=${BUBLIK_UI_DOCS_DIR}
      - BUBLIK_SRC=${BUBLIK_SRC}
      - TE_BASE=${TE_BASE}
      - TMPDIR=${TMPDIR}
      - SECURE_HTTP=${SECURE_HTTP:-False}
      - ENABLE_JSON_LOGS_PROXY=${ENABLE_JSON_LOGS_PROXY:-True}
      - BUBLIK_LOGDIR=${BUBLIK_LOGDIR}
      - BUBLIK_LOG=${BUBLIK_LOG}
      - BUBLIK_ACCESS_LOG=${BUBLIK_ACCESS_LOG}
      - MANAGEMENT_COMMANDS_LOG=${MANAGEMENT_COMMANDS_LOG}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - ANALYTICS_ENABLED=${ANALYTICS_ENABLED:-False}
      - ANALYTICS_DB_PATH=/app/bublik/analytics/analytics.sqlite3
      - AI_CHAT_ENABLED=${AI_CHAT_ENABLED:-False}
      - CELERY_APP=${CELERY_APP}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - CELERY_ACCEPT_CONTENT=${CELERY_ACCEPT_CONTENT}
      - CELERY_TASK_SERIALIZER=${CELERY_TASK_SERIALIZER}
      - CELERY_RESULT_SERIALIZER=${CELERY_RESULT_SERIALIZER}
      - CELERY_CREATE_DIRS=${CELERY_CREATE_DIRS}
      - CELERYD_MAX_TASKS_PER_CHILD=${CELERYD_MAX_TASKS_PER_CHILD}
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL}
      - FLOWER_PERSISTENT=${FLOWER_PERSISTENT}
      - FLOWER_PORT=${FLOWER_PORT}
      - FLOWER_URL_PREFIX=${FLOWER_URL_PREFIX}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - BUBLIK_WORKERS=${BUBLIK_WORKERS}
      - BUBLIK_TIMEOUT=${BUBLIK_TIMEOUT}
      - BUBLIK_GRACEFUL_TIMEOUT=${BUBLIK_GRACEFUL_TIMEOUT}
      - BUBLIK_WEB_NAME=${BUBLIK_WEB_NAME}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_ADMINS=${EMAIL_ADMINS}
      - HOST_UID=${HOST_UID:-1000}
      - BUBLIK_DOCKER_MCP_HOST=${BUBLIK_DOCKER_MCP_HOST:-127.0.0.1}
      - BUBLIK_DOCKER_MCP_PORT=${BUBLIK_DOCKER_MCP_PORT:-8001}
      - HOST_GID=${HOST_GID:-1000}
      - UMASK=${UMASK:-022}
    depends_on:
      - db
      - redis
      - rabbitmq
    volumes:
      - static_data:/app/bublik/bublik/representation/static
      - ${BUBLIK_DOCKER_DATA_DIR}/django-logs:/app/bublik/logs
    develop:
      watch:
        - path: ./bublik
          action: sync
          target: /app/bublik
          ignore:
            - .venv
            - bublik-ui

        - path: ./bublik/requirements.txt
          action: rebuild

  django:
    container_name: ${COMPOSE_PROJECT_NAME}-django
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - URL_PREFIX=${URL_PREFIX}
        - DOCS_URL=${DOCS_URL}
        # Exported by scripts/git_version_env.sh in the docker:dev:* Taskfile tasks.
        - BUBLIK_REPO_URL=${BUBLIK_REPO_URL:-}
        - BUBLIK_REPO_BRANCH=${BUBLIK_REPO_BRANCH:-}
        - BUBLIK_REPO_TAG=${BUBLIK_REPO_TAG:-}
        - BUBLIK_COMMIT_REV=${BUBLIK_COMMIT_REV:-}
        - BUBLIK_COMMIT_DATE=${BUBLIK_COMMIT_DATE:-}
        - BUBLIK_COMMIT_SUMMARY=${BUBLIK_COMMIT_SUMMARY:-}
        - BUBLIK_BUILD_DATE=${BUBLIK_BUILD_DATE:-}
    command: uvicorn bublik.asgi:application --host ${BUBLIK_DOCKER_DJANGO_HOST} --port ${BUBLIK_DOCKER_DJANGO_PORT} --reload
    entrypoint: ./entrypoint-django.sh
    network_mode: host
    env_file: .env
    environment:
      - BUBLIK_DOCKER_PROXY_PORT=${BUBLIK_DOCKER_PROXY_PORT}
      - BUBLIK_DOCKER_PROXY_EXT_PORT=${BUBLIK_DOCKER_PROXY_EXT_PORT}
      - PER_CONF_DIR=${PER_CONF_DIR}
      - SECRET_KEY=${SECRET_KEY}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@bublik.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin}
      - URL_PREFIX=${URL_PREFIX}
      - BUBLIK_UI_DIR=${BUBLIK_UI_DIR}
      - BUBLIK_UI_DOCS_DIR=${BUBLIK_UI_DOCS_DIR}
      - BUBLIK_SRC=${BUBLIK_SRC}
      - TE_BASE=${TE_BASE}
      - TMPDIR=${TMPDIR}
      - SECURE_HTTP=${SECURE_HTTP:-False}
      - ENABLE_JSON_LOGS_PROXY=${ENABLE_JSON_LOGS_PROXY:-True}
      - BUBLIK_LOGDIR=${BUBLIK_LOGDIR}
      - BUBLIK_LOG=${BUBLIK_LOG}
      - BUBLIK_ACCESS_LOG=${BUBLIK_ACCESS_LOG}
      - MANAGEMENT_COMMANDS_LOG=${MANAGEMENT_COMMANDS_LOG}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - ANALYTICS_ENABLED=${ANALYTICS_ENABLED:-False}
      - ANALYTICS_DB_PATH=/app/bublik/analytics/analytics.sqlite3
      - AI_CHAT_ENABLED=${AI_CHAT_ENABLED:-False}
      - CELERY_APP=${CELERY_APP}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - CELERY_ACCEPT_CONTENT=${CELERY_ACCEPT_CONTENT}
      - CELERY_TASK_SERIALIZER=${CELERY_TASK_SERIALIZER}
      - CELERY_RESULT_SERIALIZER=${CELERY_RESULT_SERIALIZER}
      - CELERY_CREATE_DIRS=${CELERY_CREATE_DIRS}
      - CELERYD_MAX_TASKS_PER_CHILD=${CELERYD_MAX_TASKS_PER_CHILD}
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL}
      - FLOWER_PERSISTENT=${FLOWER_PERSISTENT}
      - FLOWER_PORT=${FLOWER_PORT}
      - FLOWER_URL_PREFIX=${FLOWER_URL_PREFIX}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - BUBLIK_WORKERS=${BUBLIK_WORKERS}
      - BUBLIK_TIMEOUT=${BUBLIK_TIMEOUT}
      - BUBLIK_GRACEFUL_TIMEOUT=${BUBLIK_GRACEFUL_TIMEOUT}
      - BUBLIK_WEB_NAME=${BUBLIK_WEB_NAME}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_ADMINS=${EMAIL_ADMINS}
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - UMASK=${UMASK:-022}
      # Set AI_CHAT_FILE_STORAGE_BACKEND to "local" to store generated chat
      # files under ${BUBLIK_DOCKER_DATA_DIR}/ai-chat-files instead, and drop
      # the seaweedfs service.
      - AI_CHAT_FILE_STORAGE_BACKEND=${AI_CHAT_FILE_STORAGE_BACKEND:-s3}
      - AI_CHAT_FILE_STORAGE_DIR=${AI_CHAT_FILE_STORAGE_DIR:-/app/bublik/ai-chat-files}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://127.0.0.1:8333}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-bublik}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-bublik-secret-key}
      - S3_BUCKET=${S3_BUCKET:-bublik-ai-chat-files}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PRESIGN_EXPIRY=${S3_PRESIGN_EXPIRY:-300}
      - IMPORT_UPLOAD_MAX_SIZE=${IMPORT_UPLOAD_MAX_SIZE:-2147483648}
      - LOGS_S3_CACHE_DIR=/app/bublik/logs-s3-cache
      - AI_CHAT_FILE_MAX_SIZE=${AI_CHAT_FILE_MAX_SIZE:-20971520}
    depends_on:
      - db
      - redis
      - rabbitmq
      - seaweedfs
    volumes:
      - static_data:/app/bublik/bublik/representation/static
      - ${BUBLIK_DOCKER_DATA_DIR}/django-logs:/app/bublik/logs
      - analytics_data:/app/bublik/analytics
      - ${BUBLIK_DOCKER_DATA_DIR}/ai-chat-files:/app/bublik/ai-chat-files
      - ${BUBLIK_DOCKER_DATA_DIR}/logs-s3-cache:/app/bublik/logs-s3-cache
    develop:
      watch:
        - path: ./bublik
          action: sync
          target: /app/bublik
          ignore:
            - .venv
            - bublik-ui
        - path: ./bublik/requirements.txt
          action: rebuild

  redis:
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    image: redis
    expose:
      - ${REDIS_PORT}
    ports:
      - ${REDIS_HOST}:${REDIS_PORT}:6379

  seaweedfs:
    container_name: ${COMPOSE_PROJECT_NAME}-seaweedfs
    image: chrislusf/seaweedfs:4.40
    restart: unless-stopped
    # Keep all SeaweedFS components on loopback; only its S3 API is used.
    network_mode: host
    command: >
      mini
      -dir=/data
      -ip=127.0.0.1
      -ip.bind=127.0.0.1
      -s3.port=${BUBLIK_DOCKER_SEAWEEDFS_S3_PORT:-8333}
      -s3.port.iceberg=0
      -webdav=false
      -admin.ui=false
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-bublik}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-bublik-secret-key}
      - S3_BUCKET=${S3_BUCKET:-bublik-ai-chat-files}
    volumes:
      - ${BUBLIK_DOCKER_DATA_DIR}/seaweedfs:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://127.0.0.1:${BUBLIK_DOCKER_SEAWEEDFS_S3_PORT:-8333}/status || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  rabbitmq:
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    image: rabbitmq:3-management
    expose:
      - ${RABBITMQ_PORT}
    ports:
      - ${RABBITMQ_HOST}:${RABBITMQ_PORT}:5672
      - 15672:15672

  celery:
    container_name: ${COMPOSE_PROJECT_NAME}-celery
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - URL_PREFIX=${URL_PREFIX}
        - DOCS_URL=${DOCS_URL}
        # Exported by scripts/git_version_env.sh in the docker:dev:* Taskfile tasks.
        - BUBLIK_REPO_URL=${BUBLIK_REPO_URL:-}
        - BUBLIK_REPO_BRANCH=${BUBLIK_REPO_BRANCH:-}
        - BUBLIK_REPO_TAG=${BUBLIK_REPO_TAG:-}
        - BUBLIK_COMMIT_REV=${BUBLIK_COMMIT_REV:-}
        - BUBLIK_COMMIT_DATE=${BUBLIK_COMMIT_DATE:-}
        - BUBLIK_COMMIT_SUMMARY=${BUBLIK_COMMIT_SUMMARY:-}
        - BUBLIK_BUILD_DATE=${BUBLIK_BUILD_DATE:-}
    command: >
      watchfiles --filter python 'celery -A ${CELERY_APP} worker --max-tasks-per-child ${CELERYD_MAX_TASKS_PER_CHILD} --concurrency 1 --prefetch-multiplier 1 -l ${CELERY_LOG_LEVEL}'
    entrypoint: ./entrypoint-celery.sh
    depends_on:
      - db
      - rabbitmq
    volumes:
      - ${BUBLIK_DOCKER_DATA_DIR}/django-logs:/app/bublik/logs
    env_file: .env
    environment:
      - BUBLIK_DOCKER_PROXY_PORT=${BUBLIK_DOCKER_PROXY_PORT}
      - BUBLIK_DOCKER_PROXY_EXT_PORT=${BUBLIK_DOCKER_PROXY_EXT_PORT}
      - PER_CONF_DIR=${PER_CONF_DIR}
      - SECRET_KEY=${SECRET_KEY}
      - URL_PREFIX=${URL_PREFIX}
      - BUBLIK_UI_DIR=${BUBLIK_UI_DIR}
      - BUBLIK_SRC=${BUBLIK_SRC}
      - TE_BASE=${TE_BASE}
      - TMPDIR=${TMPDIR}
      - BUBLIK_LOGDIR=${BUBLIK_LOGDIR}
      - BUBLIK_LOG=${BUBLIK_LOG}
      - BUBLIK_ACCESS_LOG=${BUBLIK_ACCESS_LOG}
      - MANAGEMENT_COMMANDS_LOG=${MANAGEMENT_COMMANDS_LOG}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - ANALYTICS_ENABLED=${ANALYTICS_ENABLED:-False}
      - ANALYTICS_DB_PATH=/app/bublik/analytics/analytics.sqlite3
      - AI_CHAT_ENABLED=${AI_CHAT_ENABLED:-False}
      - CELERY_APP=${CELERY_APP}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - CELERY_ACCEPT_CONTENT=${CELERY_ACCEPT_CONTENT}
      - CELERY_TASK_SERIALIZER=${CELERY_TASK_SERIALIZER}
      - CELERY_RESULT_SERIALIZER=${CELERY_RESULT_SERIALIZER}
      - CELERY_CREATE_DIRS=${CELERY_CREATE_DIRS}
      - CELERYD_MAX_TASKS_PER_CHILD=${CELERYD_MAX_TASKS_PER_CHILD}
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL}
      - FLOWER_PERSISTENT=${FLOWER_PERSISTENT}
      - FLOWER_PORT=${FLOWER_PORT}
      - FLOWER_URL_PREFIX=${FLOWER_URL_PREFIX}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - BUBLIK_WORKERS=${BUBLIK_WORKERS}
      - BUBLIK_TIMEOUT=${BUBLIK_TIMEOUT}
      - BUBLIK_GRACEFUL_TIMEOUT=${BUBLIK_GRACEFUL_TIMEOUT}
      - BUBLIK_WEB_NAME=${BUBLIK_WEB_NAME}
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - UMASK=${UMASK:-022}
    develop:
      watch:
        - path: ./bublik
          action: sync
          target: /app/bublik
          ignore:
            - .venv
            - bublik-ui
        - path: ./bublik/requirements.txt
          action: rebuild

  flower:
    container_name: ${COMPOSE_PROJECT_NAME}-flower
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - URL_PREFIX=${URL_PREFIX}
        - DOCS_URL=${DOCS_URL}
        # Exported by scripts/git_version_env.sh in the docker:dev:* Taskfile tasks.
        - BUBLIK_REPO_URL=${BUBLIK_REPO_URL:-}
        - BUBLIK_REPO_BRANCH=${BUBLIK_REPO_BRANCH:-}
        - BUBLIK_REPO_TAG=${BUBLIK_REPO_TAG:-}
        - BUBLIK_COMMIT_REV=${BUBLIK_COMMIT_REV:-}
        - BUBLIK_COMMIT_DATE=${BUBLIK_COMMIT_DATE:-}
        - BUBLIK_COMMIT_SUMMARY=${BUBLIK_COMMIT_SUMMARY:-}
        - BUBLIK_BUILD_DATE=${BUBLIK_BUILD_DATE:-}
    command: celery -A ${CELERY_APP} flower --persistent=${FLOWER_PERSISTENT} --url_prefix=${FLOWER_URL_PREFIX}
    env_file: .env
    environment:
      - BUBLIK_DOCKER_PROXY_PORT=${BUBLIK_DOCKER_PROXY_PORT}
      - BUBLIK_DOCKER_PROXY_EXT_PORT=${BUBLIK_DOCKER_PROXY_EXT_PORT}
      - PER_CONF_DIR=${PER_CONF_DIR}
      - SECRET_KEY=${SECRET_KEY}
      - URL_PREFIX=${URL_PREFIX}
      - BUBLIK_UI_DIR=${BUBLIK_UI_DIR}
      - BUBLIK_SRC=${BUBLIK_SRC}
      - TE_BASE=${TE_BASE}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - TMPDIR=${TMPDIR}
      - BUBLIK_LOGDIR=${BUBLIK_LOGDIR}
      - BUBLIK_LOG=${BUBLIK_LOG}
      - BUBLIK_ACCESS_LOG=${BUBLIK_ACCESS_LOG}
      - MANAGEMENT_COMMANDS_LOG=${MANAGEMENT_COMMANDS_LOG}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - ANALYTICS_ENABLED=${ANALYTICS_ENABLED:-False}
      - ANALYTICS_DB_PATH=/app/bublik/analytics/analytics.sqlite3
      - AI_CHAT_ENABLED=${AI_CHAT_ENABLED:-False}
      - CELERY_APP=${CELERY_APP}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - CELERY_ACCEPT_CONTENT=${CELERY_ACCEPT_CONTENT}
      - CELERY_TASK_SERIALIZER=${CELERY_TASK_SERIALIZER}
      - CELERY_RESULT_SERIALIZER=${CELERY_RESULT_SERIALIZER}
      - CELERY_CREATE_DIRS=${CELERY_CREATE_DIRS}
      - CELERYD_MAX_TASKS_PER_CHILD=${CELERYD_MAX_TASKS_PER_CHILD}
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL}
      - FLOWER_PERSISTENT=${FLOWER_PERSISTENT}
      - FLOWER_PORT=${FLOWER_PORT}
      - FLOWER_URL_PREFIX=${FLOWER_URL_PREFIX}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - BUBLIK_WORKERS=${BUBLIK_WORKERS}
      - BUBLIK_TIMEOUT=${BUBLIK_TIMEOUT}
      - BUBLIK_GRACEFUL_TIMEOUT=${BUBLIK_GRACEFUL_TIMEOUT}
      - BUBLIK_WEB_NAME=${BUBLIK_WEB_NAME}
    depends_on:
      - django
      - db
      - redis
      - rabbitmq
    volumes:
      - flower_data:/data
    develop:
      watch:
        - path: ./bublik
          action: sync
          target: /app/bublik
          ignore:
            - .venv
            - bublik-ui
        - path: ./bublik/requirements.txt
          action: rebuild

  nginx:
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    network_mode: host
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        - URL_PREFIX=${URL_PREFIX}
        # Exported by scripts/git_version_env.sh in the docker:dev:* Taskfile tasks.
        - BUBLIK_UI_REPO_BRANCH=${BUBLIK_UI_REPO_BRANCH:-}
        - BUBLIK_UI_REPO_TAG=${BUBLIK_UI_REPO_TAG:-}
        - BUBLIK_UI_COMMIT_REV=${BUBLIK_UI_COMMIT_REV:-}
        - BUBLIK_UI_COMMIT_DATE=${BUBLIK_UI_COMMIT_DATE:-}
        - BUBLIK_UI_COMMIT_SUMMARY=${BUBLIK_UI_COMMIT_SUMMARY:-}
    volumes:
      - ./nginx/templates/local:/etc/nginx/templates
      - static_data:/app/bublik/bublik/representation/static
      - static_te_html:/app/te-logs-static
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
      - BUBLIK_UPLOAD_MAX_BODY=${BUBLIK_UPLOAD_MAX_BODY:-2g}
      - URL_PREFIX=${URL_PREFIX}
      - DOLLAR=${DOLLAR}
      - BUBLIK_DOCKER_PROXY_PORT=${BUBLIK_DOCKER_PROXY_PORT}
      - BUBLIK_DOCKER_PROXY_EXT_PORT=${BUBLIK_DOCKER_PROXY_EXT_PORT}
      - BUBLIK_DOCKER_BUBLIK_UI_HOST=${BUBLIK_DOCKER_BUBLIK_UI_HOST}
      - BUBLIK_DOCKER_BUBLIK_UI_PORT=${BUBLIK_DOCKER_BUBLIK_UI_PORT}
      - BUBLIK_FQDN=${BUBLIK_FQDN}
      - FLOWER_HOST=${FLOWER_HOST}
      - FLOWER_PORT=${FLOWER_PORT}
      - BUBLIK_DOCKER_TE_LOG_SERVER_HOST=${BUBLIK_DOCKER_TE_LOG_SERVER_HOST}
      - BUBLIK_DOCKER_TE_LOG_SERVER_PORT=${BUBLIK_DOCKER_TE_LOG_SERVER_PORT}
      - BUBLIK_DOCKER_DJANGO_PORT=${BUBLIK_DOCKER_DJANGO_PORT}
      - BUBLIK_DOCKER_DJANGO_HOST_PROXY=${BUBLIK_DOCKER_DJANGO_HOST_PROXY}
      - BUBLIK_DOCKER_DOCS_HOST=${BUBLIK_DOCKER_DOCS_HOST}
      - BUBLIK_DOCKER_DOCS_PORT=${BUBLIK_DOCKER_DOCS_PORT}
      - BUBLIK_DOCKER_MCP_HOST=${BUBLIK_DOCKER_MCP_HOST}
      - BUBLIK_DOCKER_MCP_PORT=${BUBLIK_DOCKER_MCP_PORT}
    depends_on:
      - django
      - flower
      - bublik-ui

  bublik-ui:
    container_name: ${COMPOSE_PROJECT_NAME}-bublik-ui
    network_mode: host
    build:
      context: ./bublik-ui
      dockerfile: ./apps/bublik/Dockerfile.dev
    environment:
      - BASE_URL=${URL_PREFIX}/v2
    develop:
      watch:
        - action: sync
          path: ./bublik-ui/libs
          target: /app/libs

        - action: sync
          path: ./bublik-ui/apps
          target: /app/apps

        - action: rebuild
          path: ./bublik-ui/package.json

  bublik-docs:
    container_name: ${COMPOSE_PROJECT_NAME}-bublik-docs
    network_mode: host
    command: pnpm run start
    build:
      dockerfile: Dockerfile
      target: docs-base
      args:
        - URL_PREFIX=${URL_PREFIX}
        - DOCS_URL=${DOCS_URL:-http://localhost}
    environment:
      - BASE_URL=${URL_PREFIX}/docs
      - BUBLIK_DOCKER_DOCS_PORT=${BUBLIK_DOCKER_DOCS_PORT:-3000}
    develop:
      watch:
        - action: sync
          path: ./bublik-release
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: ./bublik-release/package.json

  mailpit:
    container_name: ${COMPOSE_PROJECT_NAME}-mailpit
    image: axllent/mailpit
    network_mode: host
    restart: unless-stopped
    ## ports:
    ##   - 8025:8025
    ##   - 1025:1025
    environment:
      - MP_SMTP_TLS_REQUIRED=${MP_SMTP_TLS_REQUIRED:-false}

  te-log-server:
    container_name: ${COMPOSE_PROJECT_NAME}-te-log-server
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile
      target: log-server
    volumes:
      - ${BUBLIK_DOCKER_DATA_DIR}/logs/logs:/home/te-logs/logs:rw
      - ${BUBLIK_DOCKER_DATA_DIR}/logs/incoming:/home/te-logs/incoming:rw
      - ${BUBLIK_DOCKER_DATA_DIR}/logs/bad:/home/te-logs/bad:rw
      - static_te_html:/app/te-logs-static
    restart: unless-stopped
    environment:
      - APACHE_LOG_DIR=/var/log/apache2
      - BUBLIK_DOCKER_TE_LOG_SERVER_PORT=${BUBLIK_DOCKER_TE_LOG_SERVER_PORT}
      - TE_INSTALL=/app/te/build/inst
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - UMASK=${UMASK:-022}
      - BUBLIK_FQDN=${BUBLIK_FQDN}
      - BUBLIK_DOCKER_PROXY_PORT=${BUBLIK_DOCKER_PROXY_PORT}
      - BUBLIK_DOCKER_PROXY_EXT_PORT=${BUBLIK_DOCKER_PROXY_EXT_PORT}
      - URL_PREFIX=${URL_PREFIX}

volumes:
  analytics_data:
  db_data:
  flower_data:
  static_data:
  static_te_html:
