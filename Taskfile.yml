version: "3"

dotenv:
  - .env
  - .env.example

vars:
  API_URL:
    sh: |
      fqdn="{{.BUBLIK_FQDN}}"
      prefix="{{.URL_PREFIX}}"
      port="{{.BUBLIK_DOCKER_PROXY_PORT}}"
      fqdn="${fqdn%/}"
      prefix="${prefix#/}"
      prefix="${prefix%/}"
      if [ "$port" = "80" ] || [ "$port" = "443" ]; then
        if [ -n "$prefix" ]; then
          echo "$fqdn/$prefix"
        else
          echo "$fqdn"
        fi
      else
        if [ -n "$prefix" ]; then
          echo "$fqdn:$port/$prefix"
        else
          echo "$fqdn:$port"
        fi
      fi
  BACKUP_DIR:
    sh: echo "${CLI_ARGS:-backups}"
  LOGS_URL:
    sh: |
      fqdn="{{.BUBLIK_FQDN}}"
      prefix="{{.URL_PREFIX}}"
      port="{{.BUBLIK_DOCKER_PROXY_PORT}}"
      fqdn="${fqdn%/}"
      prefix="${prefix#/}"
      prefix="${prefix%/}"
      if [ "$port" = "80" ] || [ "$port" = "443" ]; then
        if [ -n "$prefix" ]; then
          echo "$fqdn/$prefix/logs/"
        else
          echo "$fqdn/logs/"
        fi
      else
        if [ -n "$prefix" ]; then
          echo "$fqdn:$port/$prefix/logs/"
        else
          echo "$fqdn:$port/logs/"
        fi
      fi
  E2E_MANIFEST: '{{.BUBLIK_E2E_MANIFEST | default ".e2e/e2e-manifest.json"}}'
  E2E_META_DATA_SCHEMA: bublik/bublik/data/schemas/meta_data.json
  E2E_PLAN_FILE: '{{.BUBLIK_E2E_PLAN_FILE | default "e2e/plan.json"}}'
  E2E_RUN_LOG_SCHEMA: bublik/bublik/data/schemas/run_log.json
  E2E_DATA_DIR: '{{.BUBLIK_E2E_DATA_DIR | default (printf "%s/e2e" .BUBLIK_DOCKER_DATA_DIR)}}'
  E2E_PUBLISH_DIR: '{{.BUBLIK_E2E_PUBLISH_DIR | default (printf "%s/logs/logs/e2e" .E2E_DATA_DIR)}}'
  NORMAL_COMPOSE_PROJECT_NAME: '{{.COMPOSE_PROJECT_NAME | default "bublik"}}'
  E2E_COMPOSE_PROJECT_NAME: '{{.BUBLIK_E2E_COMPOSE_PROJECT_NAME | default (printf "%s-e2e" (.COMPOSE_PROJECT_NAME | default "bublik"))}}'
  E2E_READY_TIMEOUT: '{{.BUBLIK_E2E_READY_TIMEOUT | default "180"}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  ###########################################
  #         Git                             #
  ###########################################
  init:
    desc: Initialize Git submodules
    summary: Initialize and update all Git submodules recursively
    aliases: [i]
    status:
      - |
        # Check if all submodules are initialized and up to date
        test -z "$(git submodule status | grep '^-\|^+')"
    cmds:
      - git submodule init
      - git submodule update --init --recursive

  update:
    desc: Update Git submodules to latest commits
    summary: Update all Git submodules to their latest remote commits
    aliases: [u]
    status:
      - |
        # Check if any submodule needs updating
        test -z "$(git submodule status | grep '^+')"
    cmds:
      - git submodule update --remote

  ###########################################
  #         Docker Environment              #
  ###########################################
  docker:setup:
    desc: Setup Docker environment (copy env and settings files)
    summary: |
      Prepare Docker environment by copying necessary configuration files
      Uses BUBLIK_DOCKER_DATA_DIR from env
    aliases: [setup]
    deps: [check-deps]
    silent: true
    cmds:
      - task: docker:setup:env
      - task: docker:setup:django-settings

  docker:setup:django-settings:
    desc: Copy django settings template
    internal: true
    silent: true
    cmds:
      - ./scripts/setup_settings.sh

  docker:setup:env:
    desc: Copy .env.local to .env
    internal: true
    status:
      - test -f .env
    silent: true
    cmds:
      - ./scripts/setup_env.sh
      - task: docker:setup:env:uid

  docker:setup:env:uid:
    desc: Add host UID/GID to .env
    internal: true
    silent: true
    vars:
      HOST_UID:
        sh: id -u
      HOST_GID:
        sh: id -g
    cmds:
      - |
        OS_TYPE="$(uname -s)"

        if [ "$OS_TYPE" = "Darwin" ]; then
          if dscl . -read /Groups/www-data PrimaryGroupID 2>/dev/null | grep -q PrimaryGroupID; then
            GID_TO_USE=$(dscl . -read /Groups/www-data PrimaryGroupID | awk '{print $2}')
          else
            if dscl . -read /Groups/_www PrimaryGroupID 2>/dev/null | grep -q PrimaryGroupID; then
              GID_TO_USE=$(dscl . -read /Groups/_www PrimaryGroupID | awk '{print $2}')
              echo "ℹ️  Using macOS _www group (GID: $GID_TO_USE)"
            else
              echo "⚠️  Warning: Neither www-data nor _www group exists on this system"
              echo "Using your primary group (GID: {{.HOST_GID}}) instead"
              GID_TO_USE="{{.HOST_GID}}"
            fi
          fi
        else
          WWW_DATA_GID=$(getent group www-data 2>/dev/null | cut -d: -f3)
          if [ -z "$WWW_DATA_GID" ]; then
            echo "⚠️  Warning: www-data group does not exist on this system"
            echo "Please create it with: sudo groupadd -g 33 www-data"
            echo "Or add your user to an existing web server group"
            exit 1
          fi
          GID_TO_USE="$WWW_DATA_GID"
        fi

        if [ -f .env ]; then
          tmp_env=$(mktemp)
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ ! "$line" =~ ^HOST_(UID|GID)= ]]; then
              echo "$line" >> "$tmp_env"
            fi
          done < .env
          echo "HOST_UID={{.HOST_UID}}" >> "$tmp_env"
          echo "HOST_GID=$GID_TO_USE" >> "$tmp_env"
          mv "$tmp_env" .env
        fi

  docker:dev:watch:
    desc: Start development environment in watch mode
    summary: |
      Start development environment with live reload capability
      Environment will be accessible at {{.API_URL}}
    deps: [docker:setup]
    aliases: [dev:watch]
    cmds:
      - docker compose -f docker-compose.dev.yml -f docker-compose.db.yml up --build --watch
      - echo "🚀 Development environment started at {{.API_URL}}"

  docker:dev:up:
    desc: Start development environment
    deps: [docker:setup]
    aliases: [dev:up]
    silent: true
    cmds:
      - docker compose -f docker-compose.dev.yml -f docker-compose.db.yml up --build -d
      - echo "🚀 Development environment started at {{.API_URL}}"

  docker:dev:start:
    desc: Start development environment
    deps: [docker:setup]
    aliases: [dev:start]
    silent: true
    cmds:
      - docker compose -f docker-compose.dev.yml -f docker-compose.db.yml start
      - echo "🚀 Development environment started at {{.API_URL}}"

  docker:start:
    desc: Start production environment
    deps: [docker:setup]
    aliases: [start]
    silent: true
    cmds:
      - docker compose -f docker-compose.yml start
      - echo "🚀 Development environment started at {{.API_URL}}"

  docker:up:
    desc: Start production environment
    summary: |
      Start production environment with optimized settings
      Environment will be accessible at BUBLIK_FQDN
    deps: [docker:setup]
    aliases: [up]
    silent: true
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.db.yml up --force-recreate -d
      - echo "🚀 Production environment started at {{.API_URL}}"

  docker:up:with-external-db:
    desc: Start production environment
    summary: |
      Start production environment with externally deployed database
      Environment will be accessible at BUBLIK_FQDN
    deps: [docker:setup]
    aliases: [up:with-external-db]
    silent: true
    cmds:
      - docker compose -f docker-compose.yml up --force-recreate -d
      - echo "🚀 Production environment started at {{.API_URL}}"

  docker:pull:
    desc: Pull Docker images
    aliases: [pull]
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.db.yml pull

  docker:dev:stop:
    desc: Stop Docker development environment
    summary: Stop development containers while preserving data
    aliases: [dev:stop]
    cmds:
      - docker compose -f docker-compose.dev.yml -f docker-compose.db.yml stop

  docker:stop:
    desc: Stop Docker production environment
    summary: Stop and remove production containers while preserving data
    aliases: [stop]
    cmds:
      - docker compose -f docker-compose.yml stop

  docker:down:
    desc: Stop Docker development environment
    summary: Stop and remove production containers while preserving data
    aliases: [down]
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.db.yml down

  docker:dev:down:
    desc: Stop Docker development environment
    summary: Stop and remove development containers while preserving data
    aliases: [dev:down]
    cmds:
      - docker compose -f docker-compose.dev.yml -f docker-compose.db.yml down

  management:redis:reset-cache:
    desc: Reset redis cache
    aliases: [reset-redis-cache]
    cmd: docker compose exec -it redis bash -c 'redis-cli flushall'

  management:shell:
    desc: Launch a bash shell inside the Django container for interactive management
    aliases: [shell]
    cmd: docker compose exec -it django bash

  management:delete-run:
    desc: Delete a test run from the database by providing its ID
    aliases: [delete-run]
    vars:
      ID: "{{.CLI_ARGS}}"
    cmd: docker compose exec -it django bash -c 'python manage.py delete_run -i {{ .ID }}'

  logs:import-log:
    desc: Import logs from a specified .tar file
    aliases: [import]
    summary: |
      Import logs from a specified .tar file
      Usage: task logs:import-log -- ./path/to/file.tar
    silent: true
    vars:
      FILE: "{{.CLI_ARGS}}"
    cmds:
      - ./scripts/import_logs.sh {{.FILE}}

  logs:import-log-remote:
    desc: Import log from remote URL
    aliases: [import-remote]
    vars:
      URL: "{{.CLI_ARGS}}"
    cmd: curl http://localhost/api/v2/importruns/source/?url={{.URL}}

  logs:import-via-command:
    desc: Import log from remote URL
    aliases: [import-command]
    vars:
      URL: "{{.CLI_ARGS}}"
    cmd: docker compose exec -it django bash -c 'python manage.py importruns {{ .URL }}'

  logs:publish-incoming-logs:
    desc: Publish logs from incoming directory
    aliases: [publish]
    silent: true
    cmds:
      - ./scripts/publish_logs.sh

  ###########################################
  #         E2E Testing                     #
  ###########################################
  e2e:up:
    desc: Start or update the reusable e2e stack (preserves volumes)
    aliases: [e2e:preview-server]
    cmds:
      - task: e2e:up:reuse

  e2e:up:reuse:
    desc: Start or update the reusable e2e stack (preserves volumes)
    summary: |
      Use dedicated E2E volumes and host data, but the production Compose files
      still bind the normal host ports. Stop the normal stack before starting E2E.
    env:
      BUBLIK_E2E_API_URL: "{{.API_URL}}"
      BUBLIK_E2E_READY_TIMEOUT: "{{.E2E_READY_TIMEOUT}}"
      BUBLIK_DOCKER_DATA_DIR: "{{.E2E_DATA_DIR}}"
      COMPOSE_PROJECT_NAME: "{{.E2E_COMPOSE_PROJECT_NAME}}"
    cmds:
      - |
        set -eu
        case "$BUBLIK_E2E_READY_TIMEOUT" in
          ''|*[!0-9]*) echo "BUBLIK_E2E_READY_TIMEOUT must be a positive integer" >&2; exit 2 ;;
        esac
        if [ "$BUBLIK_E2E_READY_TIMEOUT" -eq 0 ]; then
          echo "BUBLIK_E2E_READY_TIMEOUT must be a positive integer" >&2
          exit 2
        fi
        docker compose -f docker-compose.yml -f docker-compose.db.yml build
        started_at=$(date +%s)
        deadline=$((started_at + BUBLIK_E2E_READY_TIMEOUT))
        docker compose -f docker-compose.yml -f docker-compose.db.yml up --no-build -d
        while :; do
          remaining=$((deadline - $(date +%s)))
          if [ "$remaining" -le 0 ]; then
            break
          fi
          request_timeout=5
          if [ "$remaining" -lt "$request_timeout" ]; then request_timeout=$remaining; fi
          if curl --fail --silent --show-error --max-time "$request_timeout" "$BUBLIK_E2E_API_URL/api/v2/" >/dev/null 2>&1; then
            remaining=$((deadline - $(date +%s)))
            if [ "$remaining" -le 0 ]; then break; fi
            request_timeout=5
            if [ "$remaining" -lt "$request_timeout" ]; then request_timeout=$remaining; fi
            if curl --fail --silent --show-error --max-time "$request_timeout" "$BUBLIK_E2E_API_URL/v2/" >/dev/null 2>&1; then
              remaining=$((deadline - $(date +%s)))
              if [ "$remaining" -le 0 ]; then break; fi
              request_timeout=5
              if [ "$remaining" -lt "$request_timeout" ]; then request_timeout=$remaining; fi
              if curl --fail --silent --show-error --max-time "$request_timeout" "$BUBLIK_E2E_API_URL/logs/" >/dev/null 2>&1; then
                remaining=$((deadline - $(date +%s)))
                if [ "$remaining" -le 0 ]; then break; fi
                celery_timeout=5
                if [ "$remaining" -lt "$celery_timeout" ]; then celery_timeout=$remaining; fi
                celery_ping=$(docker compose -f docker-compose.yml -f docker-compose.db.yml exec -T celery celery -A "$CELERY_APP" inspect ping --timeout "$celery_timeout" 2>/dev/null || true)
                case "$celery_ping" in
                  *pong*)
                    echo "E2E API, UI, logs, and Celery are ready at $BUBLIK_E2E_API_URL"
                    exit 0
                    ;;
                esac
              fi
            fi
          fi
          remaining=$((deadline - $(date +%s)))
          if [ "$remaining" -le 0 ]; then
            break
          fi
          if [ "$remaining" -gt 1 ]; then sleep 1; fi
        done
        echo "E2E API, UI, logs, and Celery did not become ready within $BUBLIK_E2E_READY_TIMEOUT seconds" >&2
        docker compose -f docker-compose.yml -f docker-compose.db.yml ps --all
        docker compose -f docker-compose.yml -f docker-compose.db.yml logs --tail=200
        exit 1

  e2e:up:fresh:
    desc: Recreate the e2e stack with new volumes and generated artifacts
    cmds:
      - task: e2e:reset
      - task: e2e:up:reuse

  e2e:plan:check:
    desc: Validate the versioned default e2e fixture plan
    env:
      BUBLIK_E2E_PLAN_FILE: "{{.E2E_PLAN_FILE}}"
    cmds:
      - python3 scripts/e2e_plan.py check

  e2e:plan:test:
    desc: Run unit tests for e2e plan parsing and cleanup safety
    cmds:
      - python3 -m unittest tests/test_e2e_plan.py

  e2e:fixtures:
    desc: Generate e2e fixture bundles and manifest
    summary: |
      Generate deterministic fixture runs and the e2e manifest.
      Fixtures are auto-discovered by the installed bublik-e2e CLI.
      The default campaign is versioned in {{.E2E_PLAN_FILE}}.
      Override the default plan: task e2e:fixtures -- --runs 1 --day "2026-04-21:ok=1"
    env:
      BUBLIK_E2E_CLI_ARGS: "{{.CLI_ARGS}}"
      BUBLIK_E2E_MANIFEST: "{{.E2E_MANIFEST}}"
      BUBLIK_E2E_META_DATA_SCHEMA: "{{.E2E_META_DATA_SCHEMA}}"
      BUBLIK_E2E_PLAN_FILE: "{{.E2E_PLAN_FILE}}"
      BUBLIK_E2E_PUBLISH_DIR: "{{.E2E_PUBLISH_DIR}}"
      BUBLIK_E2E_RUN_LOG_SCHEMA: "{{.E2E_RUN_LOG_SCHEMA}}"
      BUBLIK_E2E_URL: "{{.API_URL}}"
      BUBLIK_DOCKER_DATA_DIR: "{{.E2E_DATA_DIR}}"
    cmds:
      - python3 scripts/e2e_plan.py generate

  e2e:seed:
    desc: Seed bublik with fixture runs via the bublik-e2e CLI (canonical path)
    summary: |
      Generate deterministic fixture runs and import them through the API in
      one shot (bublik-e2e run --setup-projects): creates missing projects and
      configs, imports every bundle except those planned with +ui (those are
      left for the Playwright import setup), and writes runIds into the
      manifest. Re-runs are idempotent: already-imported bundles are skipped.
      Override the default plan: task e2e:seed -- --runs 1 --day "2026-04-21:ok=1"
    env:
      BUBLIK_E2E_CLI_ARGS: "{{.CLI_ARGS}}"
      BUBLIK_E2E_MANIFEST: "{{.E2E_MANIFEST}}"
      BUBLIK_E2E_META_DATA_SCHEMA: "{{.E2E_META_DATA_SCHEMA}}"
      BUBLIK_E2E_PLAN_FILE: "{{.E2E_PLAN_FILE}}"
      BUBLIK_E2E_PUBLISH_DIR: "{{.E2E_PUBLISH_DIR}}"
      BUBLIK_E2E_RUN_LOG_SCHEMA: "{{.E2E_RUN_LOG_SCHEMA}}"
      BUBLIK_E2E_URL: "{{.API_URL}}"
      BUBLIK_DOCKER_DATA_DIR: "{{.E2E_DATA_DIR}}"
    cmds:
      - python3 scripts/e2e_plan.py run

  e2e:import:manifest:
    desc: Import an existing manifest via the API (e.g. into a running instance)
    summary: |
      Import the already-generated manifest through the API without
      regenerating fixtures. Idempotent; add flags after --, e.g.
      task e2e:import:manifest -- --include-ui
    cmds:
      - bublik-e2e import --url "{{.API_URL}}" --manifest "{{.E2E_MANIFEST}}" --setup-projects {{.CLI_ARGS}}

  e2e:import:ui:
    desc: Import the +ui-marked bundles through the Playwright import form
    summary: |
      Runs the Playwright auth + import setup projects, which import only the
      bundles marked importVia=ui through the UI import form (the API bundles
      must already be seeded — run task e2e:seed first).
    deps: [e2e:types:check]
    dir: bublik-ui
    env:
      BASE_URL: "{{.API_URL}}/v2/"
      BUBLIK_E2E_RUN_OVERVIEW: ../{{.E2E_MANIFEST}}
    cmds:
      - pnpm exec playwright test --config apps/bublik/playwright.config.ts --project auth --project import {{.CLI_ARGS}}

  e2e:
    desc: Run Playwright e2e tests against the dockerized stack
    deps: [e2e:types:check]
    dir: bublik-ui
    env:
      BASE_URL: "{{.API_URL}}/v2/"
      BUBLIK_E2E_RUN_OVERVIEW: ../{{.E2E_MANIFEST}}
      CI: "1"
    cmds:
      - pnpm exec nx run bublik:e2e

  e2e:ui:
    desc: Run Playwright e2e tests in UI mode against the dockerized stack
    deps: [e2e:types:check]
    dir: bublik-ui
    env:
      BASE_URL: "{{.API_URL}}/v2/"
      BUBLIK_E2E_RUN_OVERVIEW: ../{{.E2E_MANIFEST}}
    cmds:
      - pnpm bublik:e2e-ui

  e2e:run:
    desc: Full e2e pipeline with fresh volumes (compatibility entry point)
    cmds:
      - task: e2e:run:fresh

  e2e:run:fresh:
    desc: Run the full e2e pipeline with fresh volumes, then stop the stack
    summary: |
      Remove only the dedicated e2e stack's volumes and generated fixture
      artifacts, run the complete pipeline, and stop/remove its containers and
      volumes afterward. The manifest and fixtures remain available on failure
      for diagnostics until the next fresh run or task e2e:clean.
    cmds:
      - defer: { task: e2e:down:fresh }
      - task: e2e:reset
      - task: build
      - task: e2e:up:reuse
      - task: e2e:seed
      - task: e2e

  e2e:run:reuse:
    desc: Run the full e2e pipeline while preserving reusable volumes
    cmds:
      - task: build
      - task: e2e:up:reuse
      - task: e2e:seed
      - task: e2e

  e2e:down:
    desc: Stop/remove e2e containers while preserving reusable volumes
    env:
      BUBLIK_DOCKER_DATA_DIR: "{{.E2E_DATA_DIR}}"
      COMPOSE_PROJECT_NAME: "{{.E2E_COMPOSE_PROJECT_NAME}}"
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.db.yml down --remove-orphans

  e2e:down:fresh:
    desc: Stop/remove e2e containers and their dedicated volumes
    env:
      BUBLIK_DOCKER_DATA_DIR: "{{.E2E_DATA_DIR}}"
      BUBLIK_E2E_COMPOSE_PROJECT_NAME: "{{.E2E_COMPOSE_PROJECT_NAME}}"
      BUBLIK_NORMAL_COMPOSE_PROJECT_NAME: "{{.NORMAL_COMPOSE_PROJECT_NAME}}"
      COMPOSE_PROJECT_NAME: "{{.E2E_COMPOSE_PROJECT_NAME}}"
    cmds:
      - python3 scripts/e2e_plan.py guard-compose-project
      - docker compose -f docker-compose.yml -f docker-compose.db.yml down --volumes --remove-orphans

  e2e:logs:
    desc: Show logs from the dedicated e2e Compose project
    env:
      BUBLIK_DOCKER_DATA_DIR: "{{.E2E_DATA_DIR}}"
      COMPOSE_PROJECT_NAME: "{{.E2E_COMPOSE_PROJECT_NAME}}"
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.db.yml logs {{.CLI_ARGS}}

  e2e:reset:
    desc: Remove e2e volumes and generated artifacts without a prompt
    internal: true
    env:
      BUBLIK_E2E_MANIFEST: "{{.E2E_MANIFEST}}"
      BUBLIK_E2E_PUBLISH_DIR: "{{.E2E_PUBLISH_DIR}}"
      BUBLIK_DOCKER_DATA_DIR: "{{.E2E_DATA_DIR}}"
    cmds:
      - task: e2e:down:fresh
      - python3 scripts/e2e_plan.py clean

  e2e:clean:
    desc: Remove e2e services, volumes, fixtures, and the manifest
    prompt: This removes the dedicated {{.E2E_COMPOSE_PROJECT_NAME}} containers/volumes, generated fixtures in {{.E2E_PUBLISH_DIR}}, and {{.E2E_MANIFEST}}. Continue?
    cmds:
      - task: e2e:reset

  e2e:types:
    desc: Sync e2e manifest types from the bublik-e2e CLI schema into bublik-ui
    summary: |
      Export the manifest JSON Schema from the installed bublik-e2e CLI and
      regenerate the TypeScript types the Playwright suite consumes.
      Commit the results in bublik-ui.
    cmds:
      - bublik-e2e schema --out bublik-ui/apps/bublik/e2e/support/e2e-manifest.schema.json
      - cd bublik-ui && pnpm run e2e:codegen

  e2e:types:check:
    desc: Fail when the bublik-ui manifest types are stale or e2e code does not typecheck
    cmds:
      - bublik-e2e schema | diff -u bublik-ui/apps/bublik/e2e/support/e2e-manifest.schema.json - || (echo "Schema drift — run task e2e:types" && exit 1)
      - cd bublik-ui && pnpm run e2e:codegen:check
      - cd bublik-ui && pnpm run e2e:typecheck

  ###########################################
  #         Deps                          #
  ###########################################
  check-deps:
    desc: Check if system dependencies are installed
    summary: Verify that all required system and Docker dependencies are available
    cmds:
      - task: system:check-deps
      - task: docker:check-deps

  system:check-deps:
    desc: Check if system dependencies are installed
    internal: true
    silent: true
    cmds:
      - ./scripts/check_deps.sh system

  docker:check-deps:
    desc: Check if Docker and Docker Compose are installed
    internal: true
    silent: true
    cmds:
      - ./scripts/check_deps.sh docker

  ###########################################
  #         Shortcuts                       #
  ###########################################
  meta-categorization:
    desc: Trigger meta-categorization process
    summary: Start the meta-categorization process for test results
    cmd: docker compose exec -it django bash -c 'python manage.py meta_categorization'

  ###########################################
  #         Bootstrap                       #
  ###########################################
  bootstrap-dev:
    desc: Bootstrap the application and deploy to development environment
    summary: |
      Complete development deployment process:
      1. Start Docker containers in dev mode
      2. Initialize configurations
      3. Import initial sessions
      4. Display admin credentials
    preconditions:
      - test -f .env
      - test -f ./bublik/bublik/settings.py
    cmds:
      - task: docker:dev:up
      - cmd: echo "Waiting for 15 seconds for services to start..." && sleep 15
      - task: bootstrap:init-configs
      - task: bootstrap:import-sessions
      - task: bootstrap:print-credentials

  bootstrap:
    desc: Bootstrap the application and deploy to production
    summary: |
      Complete production deployment process:
      1. Start Docker containers
      2. Initialize configurations
      3. Import initial sessions
      4. Display admin credentials
    preconditions:
      - test -f .env
      - test -f ./bublik/bublik/settings.py
    cmds:
      - task: docker:up
      - cmd: echo "Waiting for 15 seconds for services to start..." && sleep 15
      - task: bootstrap:init-configs
      - task: print-env-info

  migrations:transition_1.8.0_to_1.9.0:
    desc: Handle migrations when updating to version 1.9.0 and higher from 1.8.0 and lower
    cmds:
      - ./scripts/create_migrations.sh

  print-env-info:
    desc: Print environment information
    silent: true
    cmds:
      - |
        echo "🔑 Admin credentials:"
        echo "  Email: {{.DJANGO_SUPERUSER_EMAIL}}"
        echo "  Password: {{.DJANGO_SUPERUSER_PASSWORD}}"
        echo "🔑 Data directory:"
        echo "  {{.BUBLIK_DOCKER_DATA_DIR}}"
        echo "🔑 INSTANCE URL:"
        echo "  {{.API_URL}}"

  bootstrap:import-sessions:
    desc: Import Test Sessions from specified file
    summary: |
      Import test sessions from a specified file containing URLs
      Usage: task bootstrap:import-sessions -- /path/to/import.txt
      Default file: bootstrap/import.txt
    deps: [auth:get-token]
    silent: true
    vars:
      IMPORT_FILE:
        sh: echo "${CLI_ARGS:-bootstrap/import.txt}"
    cmds:
      - ./scripts/import_sessions.sh "{{.API_URL}}" "{{.IMPORT_FILE}}"
      - defer: { task: auth:get-token:clean }

  bootstrap:init-configs:
    desc: Bootstrap Configs from specified directory
    summary: |
      Bootstrap configuration files from a specified directory
      Usage: task bootstrap:init-configs -- /path/to/config/dir
      Default directory: bootstrap/
    silent: true
    deps: [auth:get-token]
    vars:
      CONFIG_DIR:
        sh: echo "${CLI_ARGS:-bootstrap}"
    cmds:
      - ./scripts/bootstrap_configs.sh "{{.API_URL}}" "{{.EMAIL}}" "{{.PASSWORD}}" "{{.CONFIG_DIR}}" "{{.LOGS_URL}}"
      - defer: { task: auth:get-token:clean }

  auth:get-token:
    desc: Get access token by logging in
    summary: |
      Get authentication token by logging in with provided credentials
      Uses DJANGO_SUPERUSER_EMAIL and DJANGO_SUPERUSER_PASSWORD from env
    internal: true
    silent: true
    vars:
      EMAIL: '{{.DJANGO_SUPERUSER_EMAIL | default "admin@bublik.com"}}'
      PASSWORD: '{{.DJANGO_SUPERUSER_PASSWORD | default "admin"}}'
    cmds:
      - mkdir -p ./tmp
      - |
        echo "🔑 Logging in with {{.EMAIL}}..."
        response=$(curl -s -c ./tmp/cookies.txt "{{.API_URL}}/auth/login/" \
          -H 'Content-Type: application/json' \
          --data-raw "{\"email\":\"{{.EMAIL}}\",\"password\":\"{{.PASSWORD}}\"}")

        if grep -q "access_token" ./tmp/cookies.txt; then
          echo "✅ Successfully logged in"
          token=$(grep "access_token" ./tmp/cookies.txt | cut -f7)
          echo "$token" > ./tmp/.access_token
          echo "✅ Token saved to ./tmp/.access_token"
        else
          echo "❌ Login failed"
          echo "$response"
          exit 1
        fi

  auth:get-token:clean:
    desc: Clean up access token
    summary: Remove temporary authentication files
    internal: true
    cmds:
      - rm -f ./tmp/cookies.txt ./tmp/.access_token

  ###########################################
  #         Backup Operations              #
  ###########################################
  backup:create:
    desc: Create a complete backup of database and TE logs
    silent: true
    summary: |
      Create a complete backup archive containing database
      Usage: task backup:create -- /path/to/backup/dir
      Default directory: ./backups/
    cmds:
      - ./scripts/backup_operations.sh create {{.BACKUP_DIR}}

  backup:restore:
    desc: Restore database from a backup archive
    silent: true
    summary: |
      Restore complete backup from an archive
      Usage: task backup:restore -- /path/to/backup.tar.gz
    cmds:
      - ./scripts/backup_operations.sh restore {{.CLI_ARGS}}

  backup:list:
    desc: List available backup archives
    silent: true
    summary: |
      List all backup archives in the backup directory
      Usage: task backup:list -- /path/to/backup/dir
      Default directory: ./backups/
    cmds:
      - ./scripts/backup_operations.sh list {{.BACKUP_DIR}}

  ###########################################
  #         Docker Images                   #
  ###########################################
  docker:build-images:
    desc: Build Docker images
    summary: Build Runner, Log Server, and Nginx images
    aliases: [build]
    silent: true
    cmds:
      - task: docker:setup:django-settings
      - task: docker:build:runner
      - task: docker:build:log-server
      - task: docker:build:nginx

  docker:build:runner:
    desc: Build Runner image
    internal: true
    cmds:
      - >
        docker build
        --network=host
        --target runner
        --build-arg URL_PREFIX=${URL_PREFIX}
        --build-arg DOCS_URL=${DOCS_URL}
        -t ${DOCKER_REGISTRY}/${DOCKER_ORG}/${RUNNER_IMAGE_NAME}:${IMAGE_TAG}
        .

  docker:build:log-server:
    desc: Build Log Server image
    internal: true
    cmds:
      - >
        docker build
        --network=host
        --target log-server
        --build-arg URL_PREFIX=${URL_PREFIX}
        --build-arg DOCS_URL=${DOCS_URL}
        -t ${DOCKER_REGISTRY}/${DOCKER_ORG}/${LOG_SERVER_IMAGE_NAME}:${IMAGE_TAG}
        .

  docker:build:nginx:
    desc: Build Nginx image
    internal: true
    cmds:
      - >
        docker build
        --network=host
        --build-arg URL_PREFIX=${URL_PREFIX}
        --build-arg DOCS_URL=${DOCS_URL}
        -t ${DOCKER_REGISTRY}/${DOCKER_ORG}/${NGINX_IMAGE_NAME}:${IMAGE_TAG}
        -f ./nginx/Dockerfile
        .

  docker:push-images:
    desc: Push Docker images to registry
    summary: Push Runner, Log Server, and Nginx images to container registry
    aliases: [push]
    cmds:
      - docker push ${DOCKER_REGISTRY}/${DOCKER_ORG}/${RUNNER_IMAGE_NAME}:${IMAGE_TAG}
      - docker push ${DOCKER_REGISTRY}/${DOCKER_ORG}/${LOG_SERVER_IMAGE_NAME}:${IMAGE_TAG}
      - docker push ${DOCKER_REGISTRY}/${DOCKER_ORG}/${NGINX_IMAGE_NAME}:${IMAGE_TAG}
